<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
</head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>       

<header>
    Table HTML
         
</header>
<style>

    */ .Ankit{
        font-family:"Plawrite HU" ;
        font-size:30px; */

    }
          
     body
     { 
        margin:0px;
        padding:0px;
        transition:0.50s;

     }
     header
     {
        background:black;
        color:white;
        text-align:center;
        padding:12px; 
        text-transform:uppercase;

     }
     footer
     {
      background:black;
      color:white;
      text-align:center;
      padding:12px;
      text-transform:uppercase;
      clear: both;

     }
     main table 
     {
        width: 95%;
        margin:auto;
        margin-top:40px;
        margin-bottom:20px;
        background:rgb(107, 166, 182);
        color:aliceblue;
        text-align:center;
        font-size:20px;
        font-family:'Times New Roman',Times,serif;
        cursor:pointer;
        height:400px;
        
     }
     main table tr:hover
    {background:rgb(rgb(30, 72, 143));
    }
    
    main table td:hover 
    {
     transition:0.50s;
     transform: scale(1.85);
     background:rgb(90, 109, 228);   
     font-size:30px;
     }

    /* Large devices (laptops/desktops,992px and up) */
    @media only screen and (min-width:992px)

    {
         
        body{//background:green;}
        header
        {
            font: size 100px;
        }

        main table
        {
            width: 100%;
            border: 5px red ridge;
        }
        main table tr td,th
        {
            border:0px;
            border-bottom:1px;color:(55, 56, 174)ridge;
        }

        footer{
            height:200px;

        }
    }

    /* Small devices (Portrait tablets and large phones, 600px and up) */
    @media only screen and (min-width:600px)

    {
        
        body{//background:Brown;}
        header
        {
            font: size 100px;
        }

        main table
        {
            width: 100%;
            border: 5px rgb(228, 137, 0) ridge;
        }
        main table tr td,th
        {
            border:0px;
            border-bottom:1px;color:rgb(255, 228, 196)ridge;
            }

        footer{
            height:200px;

        }
    }

     /* Extra Small devices (Phones, 600px and down) */
    @media only screen and (max-width:600px)

    {
         
        body{//background:grey;}
        header
        {
            font: size 100px;
        }

        main table
        {
            width: 100%;
            border: 5px rgb(78, 159, 193) ridge;
        }
        main table tr td,th
        {
            border:0px;
            border-bottom:1px;color:rgb(100, 0, 0)ridge;
            }

        footer{
            height:200px;

        }
    }

    </style>
    <body>
        <main>
            <table border="1" cellpadding="3" callspacing="2">
                  <caption class="MARKS" style="color:rgb(0, 0, 0)">MARKS </caption>
                  <tr>
                    <th colspan="3" style="background-color:color:rgb(96,26,161)">Modern School</th> 
                    </tr>                 
                  
                  <tr>
                    <th>Roll No</th><th>Name</th><th>Marks</th>
                    </tr>   
                    <tr><td>10</td><td>Ram</td><td>90</td></tr>
                    <tr><td>12</td><td>shyam</td><td>85</td></tr>
                    <tr><td>20</td><td>Mohan</td><td>79</td></tr>
                    <tr><td>18</td><td>Ravi</td><td>88</td></tr>
                    <tr><td>32</td><td>Shiva</td><td>70</td></tr>
                    <tr><td>22</td><td>Jass</td><td>66</td></tr>
                    <tr><td>19</td><td>Varun</td><td>50</td></tr>
                  
                    </table>

                    
            </main>
            <footer>All Rights Reserved &reg;</footer>
            </body>
            </html>
